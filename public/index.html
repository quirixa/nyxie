<script>
  /* Keyboard-aware viewport height.
     100dvh/100vh do NOT shrink for the on-screen keyboard in a lot of
     mobile/in-app browsers (only some Chromium builds honor
     interactive-widget=resizes-content above). The Visual Viewport API
     is the one thing that reliably reports the space actually left
     after the keyboard opens, in every modern mobile browser, so we
     mirror it into a CSS var and let app.css/dashboard.css consume it. */
  (function () {
    function setAppHeight() {
      var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
      document.documentElement.style.setProperty('--app-height', h + 'px');
    }
    setAppHeight();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setAppHeight);
      window.visualViewport.addEventListener('scroll', setAppHeight);
    }
    window.addEventListener('orientationchange', setAppHeight);
    window.addEventListener('resize', setAppHeight);
  })();
</script>

<style>
    /* ─── Cropper Overlay ──────────────────────────────────── */
    .cropper-overlay {
    position: fixed;
    inset: 0;
    z-index: 100000;
    background: rgba(0, 0, 0, 0.40);          /* was 0.75 – now much lighter */
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Inter, sans-serif;
    backdrop-filter: blur(2px);              /* reduce blur from 4px to 2px */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
}
.cropper-overlay.open {
    opacity: 1;
    pointer-events: auto;
}
    .cropper-modal {
        background: var(--bg-secondary, #1a1a1a);
        border-radius: 16px;
        padding: 24px;
        max-width: 560px;
        width: 95vw;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        border: 1px solid var(--border-color, #2c2c2c);
    }
    .cropper-modal h3 {
        color: var(--text-primary, #f5f5f5);
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0 0 4px 0;
    }
    .cropper-preview-wrap {
        position: relative;
        margin: 12px 0;
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        background: #0a0a0a;
        border-radius: 12px;
    }
    /* Banner mode will override aspect-ratio via JS or a class later */
    .cropper-preview {
        position: relative;
        width: 100%;
        height: 100%;
        touch-action: none;
        user-select: none;
    }
    .cropper-preview canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
    }
    .cropper-preview canvas:active {
        cursor: grabbing;
    }
    .cropper-mask {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: 50%;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        transition: border-radius 0.2s;
    }
    /* If banner, the mask becomes a rectangle (no mask) */
    .cropper-mask.banner-mode {
        border-radius: 0;
        box-shadow: none;
        display: none;
    }
    .cropper-controls-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0;
        color: var(--text-secondary, #aaa);
    }
    .cropper-controls-row label {
        font-size: 0.85rem;
        font-weight: 500;
        flex-shrink: 0;
    }
    .cropper-controls-row input[type="range"] {
        flex: 1;
        background: transparent;
        accent-color: var(--accent, #fd6671);
    }
    .cropper-controls-row span {
        min-width: 40px;
        text-align: center;
        font-size: 0.85rem;
    }
    .cropper-error {
        color: #ff6b6b;
        font-size: 0.8rem;
        margin-top: 8px;
        text-align: center;
        display: none;
    }
    .cropper-controls {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--border-color, #2c2c2c);
    }
    .cropper-controls .btn-cancel {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background: var(--bg-tertiary, #262626);
        color: var(--text-secondary, #ccc);
        font-weight: 500;
        cursor: pointer;
        font-size: 0.85rem;
    }
    .cropper-controls .btn-cancel:hover {
        background: var(--bg-hover, #333);
    }
    .cropper-controls .btn-primary {
        padding: 10px 24px;
        border: none;
        border-radius: 8px;
        background: var(--accent, #fd6671);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.85rem;
    }
    .cropper-controls .btn-primary:hover {
        filter: brightness(1.1);
    }
    .cropper-controls .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>

<!-- Landing Background Styles -->
<style>
#view-landing {
    position: relative;
    overflow: hidden;
}

/* Grid lines */
.lnd-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    pointer-events: none;
}

/* Solid-color blobs — no gradients */
.lnd-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
}
.lnd-blob-1 {
    width: 600px; height: 600px;
    background: #ed4245;
    opacity: 0.04;
    top: -15%; left: -10%;
    animation: lnd-drift1 22s ease-in-out infinite;
}
.lnd-blob-2 {
    width: 500px; height: 500px;
    background: #fd6671;
    opacity: 0.03;
    bottom: -20%; right: -10%;
    animation: lnd-drift2 26s ease-in-out infinite;
}
.lnd-blob-3 {
    width: 400px; height: 400px;
    background: #ed4245;
    opacity: 0.025;
    top: 40%; right: 25%;
    animation: lnd-drift3 20s ease-in-out infinite;
}
@keyframes lnd-drift1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(50px,-40px) scale(1.1); }
}
@keyframes lnd-drift2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-40px,50px) scale(0.95); }
}
@keyframes lnd-drift3 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(30px,30px) scale(1.05); }
}

/* Diagonal tracer lines */
.lnd-tracer-wrap {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
}
.lnd-tracer {
    position: absolute;
    width: 200%;
    height: 1px;
    background: rgba(237,66,69,0.06);
    transform-origin: left center;
}
.lnd-tracer:nth-child(1) {
    top: 20%; left: -50%;
    transform: rotate(-15deg);
    animation: lnd-trace1 14s linear infinite;
}
.lnd-tracer:nth-child(2) {
    top: 50%; left: -50%;
    transform: rotate(-15deg);
    animation: lnd-trace2 18s linear infinite;
}
.lnd-tracer:nth-child(3) {
    top: 80%; left: -50%;
    transform: rotate(-15deg);
    animation: lnd-trace3 12s linear infinite;
}
.lnd-tracer:nth-child(4) {
    top: 35%; left: -50%;
    transform: rotate(-15deg);
    animation: lnd-trace1 20s linear infinite reverse;
    background: rgba(253,102,113,0.04);
}
@keyframes lnd-trace1 {
    0% { transform: rotate(-15deg) translateX(-100%); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: rotate(-15deg) translateX(100%); opacity: 0; }
}
@keyframes lnd-trace2 {
    0% { transform: rotate(-15deg) translateX(-100%); opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: rotate(-15deg) translateX(100%); opacity: 0; }
}
@keyframes lnd-trace3 {
    0% { transform: rotate(-15deg) translateX(-100%); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { transform: rotate(-15deg) translateX(100%); opacity: 0; }
}

/* Ensure landing content stays above background */
#view-landing .container {
    position: relative;
    z-index: 1;
}
</style>

                <label>New Username</label>
                <input type="text" id="new-username-input" placeholder="New username" />
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="document.getElementById('change-username-modal').style.display='none'">Cancel</button>
                    <button class="btn-primary" onclick="saveUsername()">Save</button>
                </div>
            </div>
        </div>

        <div class="overlay" id="change-email-modal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
            <div class="modal">
                <h2>Change Email</h2>
                <p>Enter a new email address and confirm with your current password.</p>
                <label>New Email</label>
                <input type="email" id="new-email-input" placeholder="new@example.com" />
                <label>Current Password</label>
                <input type="password" id="email-current-password" placeholder="Your current password" />
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="document.getElementById('change-email-modal').style.display='none'">Cancel</button>
                    <button class="btn-primary" onclick="saveEmail()">Save</button>
                </div>
            </div>
        </div>

        <div class="overlay" id="change-password-modal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
            <div class="modal">
                <h2>Change Password</h2>
                <p>Enter your current password and choose a new one.</p>
                <label>Current Password</label>
                <input type="password" id="change-current-password" placeholder="Current password" />
                <label>New Password</label>
                <input type="password" id="change-new-password" placeholder="New password (min 8 chars)" />
                <label>Confirm New Password</label>
                <input type="password" id="change-confirm-password" placeholder="Confirm new password" />
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="document.getElementById('change-password-modal').style.display='none'">Cancel</button>
                    <button class="btn-primary" onclick="savePassword()">Save</button>
                </div>
            </div>
        </div>

        <div class="overlay" id="disable-account-modal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
            <div class="modal">
                <h2>Disable Account</h2>
                <p>Your account will be disabled. You can re‑enable it by logging in later.</p>
                <label>Password</label>
                <input type="password" id="disable-password" placeholder="Your current password" />
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="document.getElementById('disable-account-modal').style.display='none'">Cancel</button>
                    <button class="btn-danger" onclick="disableAccount()">Disable</button>
                </div>
            </div>
        </div>

        <div class="overlay" id="delete-account-modal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
            <div class="modal">
                <h2>Delete Account</h2>
                <p>This action is PERMANENT and cannot be undone. All your data will be lost.</p>
                <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-weight:400; color:var(--text-secondary);">
                    <input type="checkbox" id="delete-messages-checkbox" style="width:auto; margin:0;">
                    Also delete all my messages (this cannot be undone)
                </label>
                <label>Password</label>
                <input type="password" id="delete-password" placeholder="Your current password" />
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="document.getElementById('delete-account-modal').style.display='none'">Cancel</button>
                    <button class="btn-danger" onclick="deleteAccount()">Delete Forever</button>
                </div>
            </div>
        </div>

        <div id="toast"></div>
    </div>
</template>

<!-- ─── Global Cropper Overlay ─────────────────────────────── -->
<div class="cropper-overlay" id="cropper-overlay">
    <div class="cropper-modal">
        <h3 id="cropper-title">Crop Image</h3>
        <div class="cropper-preview-wrap">
            <div class="cropper-preview">
                <canvas id="cropper-canvas"></canvas>
                <div class="cropper-mask" id="cropper-mask"></div>
            </div>
        </div>
        <div class="cropper-controls-row">
            <label for="cropper-zoom">Zoom</label>
            <input type="range" id="cropper-zoom" min="0.5" max="2.0" step="0.01" value="1.0" />
            <span id="cropper-zoom-label">1.0x</span>
        </div>
        <div class="cropper-error" id="cropper-error"></div>
        <div class="cropper-controls">
            <button class="btn-cancel" id="cropper-cancel">Cancel</button>
            <button class="btn-primary" id="cropper-confirm">Crop &amp; Upload</button>
        </div>
    </div>
</div>
